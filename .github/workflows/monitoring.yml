# Run this by hand (Actions tab → "Set up TV monitoring" → Run workflow) after adding TVs
# to config.js → monitor.screens. Needs the repo secret HEALTHCHECKS_API_KEY
# (Healthchecks.io → Project Settings → API Access → Create API key, the read-write one).
name: Set up TV monitoring
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/setup-monitoring.mjs
        env:
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
