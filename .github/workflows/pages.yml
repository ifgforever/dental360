# Publishes the signage to GitHub Pages.
# Runs on every push (including saves from the admin.html "Manage screen" page)
# and every 30 minutes to pull fresh Chicago headlines into news.json.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Until Pages is switched on, this workflow simply skips instead of failing.
name: Publish signage to GitHub Pages
on:
  push:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled yet. Repo Settings → Pages → Source: GitHub Actions."
          fi
  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Chicago headlines
        run: node scripts/build-news.mjs || echo "Headline refresh failed; publishing the last saved headlines"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
