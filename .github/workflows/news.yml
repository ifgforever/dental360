# Refreshes news.json with Chicago headlines every 30 minutes.
name: Refresh Chicago headlines
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-news.mjs
      - name: Commit if headlines changed
        run: |
          if git diff --quiet -- news.json; then echo "No change"; exit 0; fi
          git config user.name "signage-bot"
          git config user.email "signage-bot@users.noreply.github.com"
          git add news.json
          git commit -m "Refresh Chicago headlines"
          git push
